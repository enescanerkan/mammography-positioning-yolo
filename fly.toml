# Fly.io — run: fly launch --no-deploy, then fly deploy
# Set app name: fly apps create <name>

app = "mammography-positioning-api"
primary_region = "fra"

[build]
  dockerfile = "deploy/Dockerfile.cpu"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"
  path = "/health"
